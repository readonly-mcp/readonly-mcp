allowBuilds:
  esbuild: true
  unrs-resolver: false

catalog:
  '@changesets/cli': ^3.0.3
  '@faker-js/faker': ^10.6.0
  '@gtbuchanan/cli': ^2.0.0
  '@gtbuchanan/eslint-config': ^0.6.0
  '@gtbuchanan/tsconfig': ^0.2.0
  '@gtbuchanan/vitest-config': ^0.4.0
  '@modelcontextprotocol/sdk': ^1.32.2
  '@types/cross-spawn': ^6.0.6
  '@types/node': ^24.19.2
  '@vitest/coverage-v8': ^5.0.5
  cross-spawn: ^7.0.6
  eslint: ^10.14.0
  jiti: ^2.7.0
  skills: ^1.7.4
  turbo: ^2.11.10
  typescript: ^7.0.0
  vitest: ^5.0.5
  zod: ^4.6.7

engineStrict: true

hoist: false

lockfileIncludeTarballUrl: false

# 4320 minutes = 3 days, matching the shared Renovate preset's quarantine.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gtbuchanan/*'
  - '@readonly-mcp/*'

overrides:
  # oxfmt 0.35 pins tinypool 2.1.0, which carries two prototype-pollution
  # advisories fixed in 2.1.2. Drop this once oxfmt moves past it.
  'tinypool@<2.1.2': 2.2.0

packages:
  - 'packages/*'

strictPeerDependencies: true
