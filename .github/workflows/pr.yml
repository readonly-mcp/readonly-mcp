# Stopgap until the repository adopts mise, which gtbuchanan/tooling's reusable
# ci.yml sets up its toolchain through.
---
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
