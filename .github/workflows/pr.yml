---
jobs:
  changeset:
    name: Changeset
    uses: gtbuchanan/tooling/.github/workflows/changeset-check.yml@cc8db05d356667bcff53d990ecee5a96a527f03c # v1.0.0

  ci:
    name: CI
    # Passed explicitly: secrets: inherit reaches only workflows in the same
    # organization or account.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    uses: gtbuchanan/tooling/.github/workflows/ci.yml@cc8db05d356667bcff53d990ecee5a96a527f03c # v1.0.0
    with:
      # The npm and pnpm integration suites carry the slow tag.
      run-slow-tests: true

  dependencies:
    name: Dependencies
    # Dependency Review comments its summary on the pull request.
    permissions:
      contents: read
      pull-requests: write
    uses: gtbuchanan/tooling/.github/workflows/dependency-review.yml@cc8db05d356667bcff53d990ecee5a96a527f03c # v1.0.0

  pre-commit:
    name: Pre-Commit
    uses: gtbuchanan/tooling/.github/workflows/pre-commit.yml@cc8db05d356667bcff53d990ecee5a96a527f03c # v1.0.0
    with:
      # The eslint and gtb-verify steps run through `pnpm exec`.
      use-pnpm: true

name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
