# npm matches a trusted publisher against the calling workflow's filename, so
# renaming this file breaks publishing until the publisher names the new one.
---
jobs:
  cd:
    name: CD
    needs: ci
    # A called workflow can only narrow the caller's token, so CD's publish
    # job gets the grants it needs from here.
    permissions:
      contents: write
      id-token: write
    # Passed explicitly: secrets: inherit reaches only workflows in the same
    # organization or account.
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    uses: gtbuchanan/tooling/.github/workflows/cd.yml@main

  ci:
    name: CI
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    uses: gtbuchanan/tooling/.github/workflows/ci.yml@main
    with:
      # The npm and pnpm integration suites carry the slow tag.
      run-slow-tests: true

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
